[pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers for different test types
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (CLI, API)
    e2e: End-to-end workflow tests (may be slow)
    slow: Tests that take significant time

# Output options
addopts =
    -v
    --strict-markers
    --tb=short

# A hung test means a deadlock regression. Fail it by name rather than letting CI
# kill the whole job with no attribution. Requires pytest-timeout (in [dev]).
timeout = 120

# Pin the asyncio fixture loop scope explicitly (pytest-asyncio warns without it).
asyncio_default_fixture_loop_scope = function

# Coverage settings live in pyproject.toml under [tool.coverage.*] — coverage.py
# does not read pytest.ini, so configuring them here has no effect.
