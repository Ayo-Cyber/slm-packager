site_name: SLM Packager
site_description: Run any small language model locally — one command.
site_url: https://ayo-cyber.github.io/slm-packager
repo_url: https://github.com/Ayo-Cyber/slm-packager
repo_name: Ayo-Cyber/slm-packager
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    scheme: slate
    primary: indigo
    accent: blue
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Getting Started:
      - Quick Start: QUICKSTART.md
      - Installation: index.md#install
  - CLI Reference: cli-reference.md
  - Runtimes: runtimes.md
  - GPU Acceleration: GPU_ACCELERATION.md
  - Guides:
      - GGUF / llama.cpp: GGUF_GUIDE.md
      - ONNX: ONNX_GUIDE.md
      - Config Reference: INIT_GUIDE.md
  - Benchmarks: benchmarks.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Ayo-Cyber/slm-packager
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/slm-packager/
