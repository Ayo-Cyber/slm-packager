model:
  name: "gpt2"
  description: "GPT-2 124M on Apple Silicon GPU"
  format: "pytorch"
  path: "gpt2"

runtime:
  type: "transformers"
  device: "mps"  # Apple Silicon GPU
  threads: 4
  context_size: 1024
  gpu_layers: 0

params:
  temperature: 0.8
  top_p: 0.95
  top_k: 50
  max_tokens: 100
  stream: false
  stop: []
